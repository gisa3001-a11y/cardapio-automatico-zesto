name: Teste Leitor Universal V2

on:
  push:
    branches:
      - main
      - leitor-universal-v2
  pull_request:
    branches:
      - main
    paths:
      - "**/*.py"
      - ".github/workflows/test-universal-v2.yml"
  workflow_dispatch:

jobs:
  test-universal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          python -m playwright install --with-deps chromium

      - name: Compilar modulos V2
        run: |
          python -m py_compile app.py
          python -m py_compile universal_router.py
          python -m py_compile structure_detector.py
          python -m py_compile generic_preview.py
          python -m py_compile platform_payload_adapters.py
          python -m py_compile platform_specialized_probe.py
          python -m py_compile rapidfood_public_probe.py
          python -m py_compile saipos_public_probe.py
          python -m py_compile brendi_nuxt_parser.py
          python -m py_compile brendi_result_enrichment.py
          python -m py_compile price_resolution.py
          python -m py_compile pizza_rules.py
          python -m py_compile universal_validation.py
          python -m py_compile universal_export.py
          python -m py_compile universal_integration.py
          python -m py_compile universal_app_bridge.py
          python -m py_compile browser_probe.py
          python -m py_compile preview_runner.py
          python -m py_compile real_url_validation.py
          python -m py_compile real_url_validation_parallel.py
          python -m py_compile real_xlsx_validation.py
          python -m py_compile real_quality_guard.py
          python -m py_compile debug_probe_urls.py
          python -m py_compile debug_network_map.py
          python -m py_compile debug_brendi_network.py
          python -m py_compile debug_brendi_nuxt.py
          python -m py_compile debug_brendi_match.py
          python -m py_compile debug_olaclick_nuxt.py
          python -m py_compile universal_readiness.py

      - name: Testes offline V2
        run: pytest -q test_universal_router_v2.py tests/test_universal_router.py test_generic_preview_filters.py tests/test_generic_groups.py test_platform_payload_adapters.py test_platform_specialized_probe.py test_rapidfood_public_probe.py test_saipos_public_probe.py test_brendi_nuxt_parser.py test_brendi_result_enrichment.py test_pizza_rules.py test_universal_price_validation.py test_validator_duplicate_option_function.py test_universal_readiness.py test_universal_export.py test_universal_integration.py test_universal_app_bridge.py test_universal_xlsx_e2e.py

      - name: Smoke test Streamlit
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 > /tmp/streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          python - <<'PY'
          import time
          import urllib.request

          url = 'http://127.0.0.1:8501/_stcore/health'
          ultimo = None
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=2) as r:
                      corpo = r.read().decode('utf-8', 'replace').strip().lower()
                      if r.status == 200 and 'ok' in corpo:
                          print('Streamlit respondeu health=ok.')
                          raise SystemExit(0)
              except Exception as exc:
                  ultimo = exc
              time.sleep(1)
          raise SystemExit(f'Streamlit não ficou saudável: {ultimo}')
          PY

      - name: Diagnostico profundo dos endpoints pendentes
        continue-on-error: true
        run: python debug_probe_urls.py

      - name: Mapa de rede dos casos pendentes
        continue-on-error: true
        run: python debug_network_map.py

      - name: Diagnostico estrutural Brendi
        continue-on-error: true
        run: python debug_brendi_network.py

      - name: Mapa Nuxt Brendi
        continue-on-error: true
        run: python debug_brendi_nuxt.py

      - name: Correspondencia real Brendi
        continue-on-error: true
        run: python debug_brendi_match.py

      - name: Mapa Nuxt Ola Click
        continue-on-error: true
        run: python debug_olaclick_nuxt.py

      - name: Publicar probe antecipado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leitor-universal-v2-probe-profundo
          path: |
            artifacts/probe_endpoints.json
            artifacts/network_map.json
            artifacts/brendi_network.json
            artifacts/brendi_nuxt.json
            artifacts/brendi_match.json
            artifacts/olaclick_nuxt.json
          if-no-files-found: warn
          retention-days: 7

      - name: Validacao controlada de URLs reais
        continue-on-error: true
        run: python real_url_validation_parallel.py

      - name: Validacao controlada de XLSX com dados reais
        continue-on-error: true
        run: python real_xlsx_validation.py

      - name: Guardas de qualidade da bateria XLSX
        continue-on-error: true
        run: python real_quality_guard.py

      - name: Avaliar prontidao da V2
        if: always()
        run: python universal_readiness.py

      - name: Publicar relatorios da bateria real
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leitor-universal-v2-relatorio-real
          path: |
            artifacts/real_url_report.json
            artifacts/real_url_report.md
            artifacts/real_xlsx_report.json
            artifacts/probe_endpoints.json
            artifacts/network_map.json
            artifacts/brendi_network.json
            artifacts/brendi_nuxt.json
            artifacts/brendi_match.json
            artifacts/olaclick_nuxt.json
            artifacts/readiness.json
          if-no-files-found: warn
          retention-days: 14

      - name: Confirmar camada universal integrada
        run: |
          python - <<'PY'
          from pathlib import Path
          assert Path('universal_router.py').exists()
          assert Path('browser_probe.py').exists()
          assert Path('platform_specialized_probe.py').exists()
          assert Path('rapidfood_public_probe.py').exists()
          assert Path('saipos_public_probe.py').exists()
          assert Path('brendi_nuxt_parser.py').exists()
          assert Path('brendi_result_enrichment.py').exists()
          assert Path('real_quality_guard.py').exists()
          assert Path('debug_brendi_match.py').exists()
          assert Path('debug_olaclick_nuxt.py').exists()
          assert Path('universal_integration.py').exists()
          assert Path('universal_app_bridge.py').exists()
          assert Path('real_xlsx_validation.py').exists()
          print('Camada universal presente e integrada na branch testada.')
          PY