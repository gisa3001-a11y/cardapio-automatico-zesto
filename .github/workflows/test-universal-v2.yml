name: Teste Leitor Universal V2

on:
  push:
    branches:
      - leitor-universal-v2
  workflow_dispatch:

jobs:
  test-universal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openpyxl pytest playwright
          python -m playwright install --with-deps chromium

      - name: Compilar modulos V2
        run: |
          python -m py_compile universal_router.py
          python -m py_compile structure_detector.py
          python -m py_compile generic_preview.py
          python -m py_compile price_resolution.py
          python -m py_compile pizza_rules.py
          python -m py_compile universal_validation.py
          python -m py_compile universal_export.py
          python -m py_compile browser_probe.py
          python -m py_compile preview_runner.py
          python -m py_compile real_url_validation.py

      - name: Testes offline V2
        run: pytest -q test_universal_router_v2.py tests/test_universal_router.py test_generic_preview_filters.py tests/test_generic_groups.py test_pizza_rules.py test_universal_price_validation.py test_universal_export.py

      - name: Validacao controlada de URLs reais
        continue-on-error: true
        run: python real_url_validation.py

      - name: Publicar relatorio da bateria real
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leitor-universal-v2-relatorio-real
          path: |
            artifacts/real_url_report.json
            artifacts/real_url_report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Garantir isolamento da main
        run: |
          python - <<'PY'
          from pathlib import Path
          assert Path('universal_router.py').exists()
          assert Path('browser_probe.py').exists()
          print('Camada universal presente somente na branch em teste.')
          PY
