name: Teste Leitor Universal V2

on:
  push:
    branches:
      - leitor-universal-v2
  workflow_dispatch:

jobs:
  test-router:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias minimas
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Compilar roteador
        run: python -m py_compile universal_router.py

      - name: Testar roteamento
        run: python -m unittest tests/test_universal_router.py -v
